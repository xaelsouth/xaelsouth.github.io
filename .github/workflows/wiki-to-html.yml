name: Publish wiki as HTML

on:
  gollum: # wiki page created or edited
  workflow_dispatch:
  push:
    paths: [tools/build_wiki.py, tools/test_build_wiki.py, .github/workflows/wiki-to-html.yml]

permissions:
  contents: write

concurrency:
  group: wiki-to-html
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install markdown
      - run: python -m unittest discover -s tools -p 'test_*.py'
      - run: python tools/build_wiki.py wiki docs "$GITHUB_REPOSITORY"
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --cached --quiet && exit 0
          git commit -m "Update HTML from wiki"
          git pull --rebase
          git push
